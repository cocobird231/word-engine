# params_full.yaml
# Phase 1~3 總驗收用參數檔：啟用所有 Phase 2+3 功能
meta:
  schema_version: "1.0.0"
  spec_name: "full_acceptance_test"
  language: "zh-TW"

project:
  project_id: "ACCEPT-001"
  document_title: "word-engine Phase 1~3 驗收文件"
  subtitle: "完整功能驗收"
  version: "v1.0"
  status: "draft"
  author: "程式蝦蝦"
  organization: "蝦蝦隊"
  updated_date: "2026-04-12"
  confidentiality: "internal"

paths:
  source_md: "./examples/final/correct_full.md"
  output_docx: "./out_acceptance.docx"
  output_pdf: "./out_acceptance.pdf"
  assets_dir: "./assets"

page:
  size: "A4"
  orientation: "portrait"

fonts:
  east_asia_default: "標楷體"
  latin_default: "Times New Roman"

headings: {}
paragraphs: {}

colors:
  text_primary: "#000000"
  accent_primary: "#1F4E79"

# Phase 2: 封面
cover:
  enabled: true
  layout: "formal"
  title_alignment: "center"
  show_subtitle: true
  show_project_id: true
  show_version: true
  show_author: true
  show_organization: true
  show_date: true
  show_confidentiality: true

# Phase 2: 目錄（Word TOC field）
toc:
  enabled: true
  title: "目錄"
  levels: 3
  use_hyperlinks: true
  page_break_before: true

# Phase 2+3: 圖表 Caption（Phase 3 使用 SEQ field）
caption_chapter_level: 2
images:
  insert_caption: true
  caption_prefix: "圖"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "below"
  max_width_cm: 14.0
  download_remote_images: false

tables:
  caption_enabled: true
  caption_prefix: "表"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "above"

# Phase 2+3: 交叉引用（Phase 3 使用 REF field）
cross_references:
  enabled: true
  style: "ieee"
  figure_reference_format:
    ieee: "圖 {number}"
  table_reference_format:
    ieee: "表 {number}"
  heading_reference_format:
    ieee: "第 {number} 節"
  bookmark_prefix_figure: "fig_"
  bookmark_prefix_table: "tbl_"
  bookmark_prefix_heading: "sec_"
  hyperlink_enabled: true

# Phase 3: 程式碼樣式
code:
  block:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
    indent_left_cm: 0.5
  inline:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
