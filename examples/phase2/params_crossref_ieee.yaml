# params_crossref_ieee.yaml
# Cross-reference IEEE 風格：圖 N, 表 N, 第 N 節
meta:
  schema_version: "1.0.0"
  spec_name: "demo_crossref_ieee"
  language: "zh-TW"

project:
  project_id: "DEMO-005"
  document_title: "交叉引用示範（IEEE 風格）"
  version: "v1.0"
  status: "draft"
  confidentiality: "internal"

paths:
  source_md: "./examples/phase2/C_crossref_demo.md"
  output_docx: "./out_crossref_ieee.docx"
  output_pdf: "./out_crossref_ieee.pdf"
  assets_dir: "./assets"

page:
  size: "A4"
  orientation: "portrait"

fonts:
  east_asia_default: "標楷體"
  latin_default: "Times New Roman"

headings: {}
paragraphs: {}

colors:
  text_primary: "#000000"
  accent_primary: "#1F4E79"

cover:
  enabled: false

toc:
  enabled: false

images:
  insert_caption: true
  caption_prefix: "圖"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "below"
  max_width_cm: 14.0
  download_remote_images: false

tables:
  caption_enabled: true
  caption_prefix: "表"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "above"

cross_references:
  enabled: true
  style: "ieee"
  figure_reference_format:
    ieee: "圖 {number}"
  table_reference_format:
    ieee: "表 {number}"
  heading_reference_format:
    ieee: "第 {number} 節"
  bookmark_prefix_figure: "fig_"
  bookmark_prefix_table: "tbl_"
  bookmark_prefix_heading: "sec_"
  hyperlink_enabled: true
# Code block and inline code styling
code:
  block:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
    indent_left_cm: 0.5
  inline:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
