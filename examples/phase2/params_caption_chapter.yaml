# params_caption_chapter.yaml
# Chapter 模式 caption：依 H1 章節計數（圖 1-1, 圖 2-1, 表 1-1）
meta:
  schema_version: "1.0.0"
  spec_name: "demo_caption_chapter"
  language: "zh-TW"

project:
  project_id: "DEMO-004"
  document_title: "圖表 Caption 示範（Chapter 模式）"
  version: "v1.0"
  status: "draft"
  confidentiality: "internal"

paths:
  source_md: "./examples/phase2/B_caption_demo.md"
  output_docx: "./out_caption_chapter.docx"
  output_pdf: "./out_caption_chapter.pdf"
  assets_dir: "./assets"

# caption_chapter_level: Which heading level triggers a chapter increment for caption numbering
# Default: 2 (H2 = Chapter, per convention: H1 = Title, H2 = Chapter)
caption_chapter_level: 2

page:
  size: "A4"
  orientation: "portrait"

fonts:
  east_asia_default: "標楷體"
  latin_default: "Times New Roman"

headings: {}
paragraphs: {}

colors:
  text_primary: "#000000"
  accent_primary: "#1F4E79"

cover:
  enabled: false

toc:
  enabled: false

images:
  insert_caption: true
  caption_prefix: "圖"
  numbering_mode: "chapter"   # chapter: 圖 1-1, 圖 2-1 依 H2 章節計數（H1=標題, H2=章節）
  chapter_separator: "-"
  caption_position: "below"
  max_width_cm: 14.0
  download_remote_images: false

tables:
  caption_enabled: true
  caption_prefix: "表"
  numbering_mode: "chapter"   # chapter: 表 1-1, 表 2-1 依 H2 章節計數（H1=標題, H2=章節）
  chapter_separator: "-"
  caption_position: "above"
# Code block and inline code styling
code:
  block:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
    indent_left_cm: 0.5
  inline:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
