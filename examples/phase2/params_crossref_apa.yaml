# params_crossref_apa.yaml
# Cross-reference APA 風格：Figure N, Table N, Section N
meta:
  schema_version: "1.0.0"
  spec_name: "demo_crossref_apa"
  language: "zh-TW"

project:
  project_id: "DEMO-006"
  document_title: "交叉引用示範（APA 風格）"
  version: "v1.0"
  status: "draft"
  confidentiality: "internal"

paths:
  source_md: "./examples/phase2/C_crossref_demo.md"
  output_docx: "./out_crossref_apa.docx"
  output_pdf: "./out_crossref_apa.pdf"
  assets_dir: "./assets"

page:
  size: "A4"
  orientation: "portrait"

fonts:
  east_asia_default: "標楷體"
  latin_default: "Times New Roman"

headings: {}
paragraphs: {}

colors:
  text_primary: "#000000"
  accent_primary: "#1F4E79"

cover:
  enabled: false

toc:
  enabled: false

images:
  insert_caption: true
  caption_prefix: "Figure"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "below"
  max_width_cm: 14.0
  download_remote_images: false

tables:
  caption_enabled: true
  caption_prefix: "Table"
  numbering_mode: "flat"
  chapter_separator: "-"
  caption_position: "above"

cross_references:
  enabled: true
  style: "apa"
  figure_reference_format:
    apa: "Figure {number}"
  table_reference_format:
    apa: "Table {number}"
  heading_reference_format:
    apa: "Section {number}"
  bookmark_prefix_figure: "fig_"
  bookmark_prefix_table: "tbl_"
  bookmark_prefix_heading: "sec_"
  hyperlink_enabled: true
