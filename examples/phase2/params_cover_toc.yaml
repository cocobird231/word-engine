# params_cover_toc.yaml
# 展示封面與目錄功能的完整參數檔
meta:
  schema_version: "1.0.0"
  spec_name: "demo_cover_toc"
  language: "zh-TW"

project:
  project_id: "DEMO-002"
  document_title: "Word Engine Phase 2 功能展示"
  subtitle: "Cover + TOC 範例"
  version: "v1.0"
  status: "draft"
  author: "程式蝦蝦"
  organization: "蝦蝦隊"
  updated_date: "2026-04-12"
  confidentiality: "internal"

paths:
  source_md: "./examples/phase2/A_basic_full.md"
  output_docx: "./out_cover_toc.docx"
  output_pdf: "./out_cover_toc.pdf"
  assets_dir: "./assets"

page:
  size: "A4"
  orientation: "portrait"

fonts:
  east_asia_default: "標楷體"
  latin_default: "Times New Roman"

headings: {}
paragraphs: {}

colors:
  text_primary: "#000000"
  accent_primary: "#1F4E79"

cover:
  enabled: true
  layout: "formal"
  title_alignment: "center"
  show_subtitle: true
  show_project_id: true
  show_version: true
  show_author: true
  show_organization: true
  show_date: true
  show_confidentiality: true

toc:
  enabled: true
  title: "目錄"
  levels: 3
  right_align_page_numbers: true
  use_hyperlinks: true
  leader: "dots"
  page_break_before: true

images:
  insert_caption: false
  download_remote_images: false

tables:
  caption_enabled: false
# Code block and inline code styling
code:
  block:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
    indent_left_cm: 0.5
  inline:
    font_family: "Consolas"
    font_size_pt: 10.5
    background_color: "#F2F2F2"
